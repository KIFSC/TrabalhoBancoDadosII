<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal PEPGH</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .grid { display: flex; gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 260px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn { display: block; width: 100%; padding: 10px; text-align: center; background: #00d285; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px; box-sizing: border-box; border: none; cursor: pointer; }
        .btn-medico { background: #182238; }
        input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .erro { color: red; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">
            <h3>Novo Paciente</h3>
            <p>Cadastre um paciente no sistema.</p>
            <a href="/novo_paciente" class="btn">Cadastrar</a>
        </div>
        <div class="card">
            <h3>Área Paciente</h3>
            <p>Consulte históricos e agende consultas.</p>
            <a href="/paciente" class="btn">Acessar</a>
        </div>
        <div class="card">
            <h3>Área Médico</h3>
            <form action="/login_medico" method="POST">
                <input type="number" name="crm" placeholder="Digite o CRM" required>
                <button type="submit" class="btn btn-medico">Entrar</button>
                {% with msgs = get_flashed_messages(category_filter=["erro_medico"]) %}
                    {% if msgs %}<p class="erro">{{ msgs[0] }}</p>{% endif %}
                {% endwith %}
            </form>
        </div>
    </div>
</body>
</html>
