<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Novo Paciente</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; width: 340px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #00d285; color: white; border: none; font-weight: bold; cursor: pointer; }
        .erro { color: red; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cadastrar Paciente</h2>
        {% with msgs = get_flashed_messages(category_filter=["erro_paciente"]) %}
            {% if msgs %}<p class="erro">{{ msgs[0] }}</p>{% endif %}
        {% endwith %}
        <form action="/cadastrar_paciente" method="POST">
            <input type="text" name="nome" placeholder="Nome Completo" required>
            <input type="number" name="cpf" placeholder="CPF (Apenas 11 números)" required>
            <input type="date" name="dataNascimento" required>
            <input type="text" name="historico" placeholder="Histórico Familiar (Opcional)">
            <button type="submit">Salvar Paciente</button>
        </form>
        <a href="/">← Voltar ao Início</a>
    </div>
</body>
</html>
